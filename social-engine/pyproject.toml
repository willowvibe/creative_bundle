[project]
name = "social-engine"
version = "0.1.0"
description = "Publishes finished videos to social accounts and manages them afterwards."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2,<3",
    "pyyaml>=6,<7",
    "typer>=0.12",
    "google-api-python-client>=2,<3",
    "google-auth-oauthlib>=1,<2",
    "google-auth-httplib2>=0.2",
    "mcp>=1,<2",
]

[project.scripts]
social = "social_engine.cli:app"
social-engine-mcp = "social_engine.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1",
    "types-PyYAML>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/social_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer declares commands through argument defaults, which triggers B008.
"src/social_engine/cli.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_configs = true
disallow_untyped_defs = true
