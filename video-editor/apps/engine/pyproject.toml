[project]
name = "video-editor-engine"
version = "0.1.0"
description = "Core Python orchestrator for raw-footage and script-to-video pipelines."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "structlog>=24.1.0",
    "video-editor-state",
    "video-editor-ffmpeg",
    "video-editor-core",
    "video-editor-llm",
    "video-editor-transcribe",
    "video-editor-asset-ingestion",
    "video-editor-skills",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_editor_engine"]
