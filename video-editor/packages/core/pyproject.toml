[project]
name = "video-editor-core"
version = "0.1.0"
description = "Shared engine: render cache, timeline, and HyperFrames CLI wrapper."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pillow>=10.0",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "structlog>=24.1.0",
    "video-editor-state",
    "video-editor-ffmpeg",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_editor_core"]
