[project]
name = "video-editor-tools"
version = "0.1.0"
description = "Thin wrappers for external tools: fast transcription, GPU, and FFmpeg."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "structlog>=24.1.0",
    "video-editor-state",
    "video-editor-ffmpeg",
    "video-editor-config",
    "video-editor-transcribe",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_editor_tools"]
