[project]
name = "video-editor-comfystudio-bridge"
version = "0.1.0"
description = "Import/export bridge between the video editor engine and ComfyStudio timeline projects."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "structlog>=24.1.0",
    "video-editor-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_editor_comfystudio_bridge"]
