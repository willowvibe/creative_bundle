[project]
name = "video-editor-asset-ingestion"
version = "0.1.0"
description = "Generative asset ingestion pipeline for cloud TTS, image, and data visualization providers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "structlog>=24.1.0",
    "httpx>=0.27",
    "matplotlib>=3.9",
    "numpy>=1.26",
    "pillow>=10.0",
    "tenacity>=8.4",
    "video-editor-state",
    "video-editor-ffmpeg",
    "video-editor-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_editor_asset_ingestion"]
