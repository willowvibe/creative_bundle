[project]
name = "video-editor-ffmpeg"
version = "0.1.0"
description = "Idempotent FFmpeg wrapper layer for the video editor engine."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "structlog>=24.1.0",
    "video-editor-state",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_editor_ffmpeg"]
