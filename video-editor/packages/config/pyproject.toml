[project]
name = "video-editor-config"
version = "0.1.0"
description = "Unified project-level configuration loader for the video editor engine."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "structlog>=24.1.0",
    "video-editor-core",
    "video-editor-state",
    "video-editor-llm",
    "video-editor-asset-ingestion",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_editor_config"]
