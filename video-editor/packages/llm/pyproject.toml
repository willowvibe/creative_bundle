[project]
name = "video-editor-llm"
version = "0.1.0"
description = "Ollama Cloud Pro client and model router for the video editor engine."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx>=0.27",
    "pyyaml>=6.0",
    "structlog>=24.1.0",
    "video-editor-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_editor_llm"]
