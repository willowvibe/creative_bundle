[project]
name = "video-editor-pipelines"
version = "0.1.0"
description = "Orchestration pipelines shared by the CLI, worker and MCP server."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "structlog>=24.1.0",
    "video-editor-asset-ingestion",
    "video-editor-config",
    "video-editor-core",
    "video-editor-engine",
    "video-editor-ffmpeg",
    "video-editor-maps",
    "video-editor-state",
    "video-editor-tools",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_editor_pipelines"]
