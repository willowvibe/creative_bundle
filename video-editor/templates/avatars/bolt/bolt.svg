<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!--
    Bolt: cartoon tech-presenter avatar for talking_avatar.
    Every layer is a top-level <g> with an id. The renderer shows `base`, one eyes-* group and one
    mouth-* group per frame. Mouth ids follow the Preston Blair / Rhubarb letters:
      X rest, A closed M/B/P, B slightly open (most consonants), C open (E/I),
      D wide open (A), E rounded (O), F puckered (U/W/OO), G teeth on lip (F/V), H tongue up (L).
    All layers share the 512x512 canvas, so they stack with no offsets.
  -->
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000" flood-opacity="0.35"/>
    </filter>
    <linearGradient id="headGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F4F7FC"/><stop offset="1" stop-color="#C9D4E5"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6A9BFF"/><stop offset="1" stop-color="#3F6FD8"/>
    </linearGradient>
    <linearGradient id="visorGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2A44"/><stop offset="1" stop-color="#0D1626"/>
    </linearGradient>
  </defs>

  <g id="base" filter="url(#shadow)">
    <!-- body -->
    <path d="M100 512 L100 440 Q100 372 176 366 L336 366 Q412 372 412 440 L412 512 Z"
          fill="url(#bodyGrad)" stroke="#1E2C45" stroke-width="7"/>
    <rect x="224" y="330" width="64" height="44" rx="10" fill="#9AA9BF" stroke="#1E2C45" stroke-width="7"/>
    <circle cx="256" cy="446" r="24" fill="#FFB547" stroke="#1E2C45" stroke-width="6"/>
    <path d="M247 437 L238 446 L247 455 M265 437 L274 446 L265 455" fill="none"
          stroke="#1E2C45" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- antenna -->
    <line x1="256" y1="74" x2="256" y2="112" stroke="#9AA9BF" stroke-width="7" stroke-linecap="round"/>
    <circle cx="256" cy="64" r="13" fill="#FFB547" stroke="#1E2C45" stroke-width="6"/>
    <!-- ears -->
    <rect x="84" y="186" width="40" height="84" rx="14" fill="url(#bodyGrad)" stroke="#1E2C45" stroke-width="7"/>
    <rect x="388" y="186" width="40" height="84" rx="14" fill="url(#bodyGrad)" stroke="#1E2C45" stroke-width="7"/>
    <!-- head -->
    <rect x="112" y="108" width="288" height="236" rx="72" fill="url(#headGrad)" stroke="#1E2C45" stroke-width="7"/>
    <!-- visor -->
    <rect x="144" y="146" width="224" height="166" rx="54" fill="url(#visorGrad)" stroke="#1E2C45" stroke-width="5"/>
    <path d="M170 168 Q200 156 240 158" fill="none" stroke="#FFFFFF" stroke-opacity="0.18"
          stroke-width="8" stroke-linecap="round"/>
    <!-- cheeks -->
    <ellipse cx="180" cy="266" rx="15" ry="8" fill="#FF7AA2" opacity="0.55"/>
    <ellipse cx="332" cy="266" rx="15" ry="8" fill="#FF7AA2" opacity="0.55"/>
  </g>

  <g id="eyes-open" filter="url(#glow)" fill="#6CF3FF">
    <ellipse cx="206" cy="212" rx="18" ry="24"/>
    <ellipse cx="306" cy="212" rx="18" ry="24"/>
    <circle cx="212" cy="203" r="5" fill="#FFFFFF"/>
    <circle cx="312" cy="203" r="5" fill="#FFFFFF"/>
  </g>
  <g id="eyes-closed" filter="url(#glow)" fill="none" stroke="#6CF3FF" stroke-width="7" stroke-linecap="round">
    <path d="M188 214 Q206 226 224 214"/>
    <path d="M288 214 Q306 226 324 214"/>
  </g>

  <!-- mouths: centred on (256, 270) -->
  <g id="mouth-X" filter="url(#glow)" transform="translate(256 272) scale(1.5) translate(-256 -272)" fill="none" stroke="#6CF3FF" stroke-width="7" stroke-linecap="round">
    <path d="M232 266 Q256 280 280 266"/>
  </g>
  <g id="mouth-A" filter="url(#glow)" transform="translate(256 272) scale(1.5) translate(-256 -272)" fill="none" stroke="#6CF3FF" stroke-width="8" stroke-linecap="round">
    <path d="M234 271 Q256 274 278 271"/>
  </g>
  <g id="mouth-B" filter="url(#glow)" transform="translate(256 272) scale(1.5) translate(-256 -272)">
    <rect x="233" y="263" width="46" height="15" rx="7.5" fill="#6CF3FF"/>
    <line x1="238" y1="270.5" x2="274" y2="270.5" stroke="#0E3E4C" stroke-width="2.5"/>
  </g>
  <g id="mouth-C" filter="url(#glow)" transform="translate(256 272) scale(1.5) translate(-256 -272)">
    <ellipse cx="256" cy="271" rx="27" ry="13" fill="#6CF3FF"/>
    <ellipse cx="256" cy="275" rx="17" ry="6" fill="#0E5E70"/>
  </g>
  <g id="mouth-D" filter="url(#glow)" transform="translate(256 272) scale(1.5) translate(-256 -272)">
    <path d="M228 262 Q256 256 284 262 Q286 298 256 300 Q226 298 228 262 Z" fill="#6CF3FF"/>
    <path d="M236 268 Q256 264 276 268 Q276 290 256 292 Q236 290 236 268 Z" fill="#0E3E4C"/>
    <ellipse cx="256" cy="286" rx="13" ry="5" fill="#FF7AA2"/>
  </g>
  <g id="mouth-E" filter="url(#glow)" transform="translate(256 272) scale(1.5) translate(-256 -272)">
    <ellipse cx="256" cy="273" rx="17" ry="19" fill="#6CF3FF"/>
    <ellipse cx="256" cy="274" rx="9" ry="11" fill="#0E3E4C"/>
  </g>
  <g id="mouth-F" filter="url(#glow)" transform="translate(256 272) scale(1.5) translate(-256 -272)">
    <ellipse cx="256" cy="272" rx="11" ry="11" fill="#6CF3FF"/>
    <ellipse cx="256" cy="272" rx="4.5" ry="5" fill="#0E3E4C"/>
  </g>
  <g id="mouth-G" filter="url(#glow)" transform="translate(256 272) scale(1.5) translate(-256 -272)">
    <path d="M234 264 L278 264" stroke="#6CF3FF" stroke-width="6" stroke-linecap="round"/>
    <rect x="245" y="265" width="22" height="7" rx="2" fill="#FFFFFF"/>
    <path d="M238 278 Q256 284 274 278" fill="none" stroke="#6CF3FF" stroke-width="6" stroke-linecap="round"/>
  </g>
  <g id="mouth-H" filter="url(#glow)" transform="translate(256 272) scale(1.5) translate(-256 -272)">
    <ellipse cx="256" cy="272" rx="24" ry="14" fill="#6CF3FF"/>
    <ellipse cx="256" cy="274" rx="15" ry="8" fill="#0E3E4C"/>
    <ellipse cx="256" cy="268" rx="8" ry="4" fill="#FF7AA2"/>
  </g>
</svg>
