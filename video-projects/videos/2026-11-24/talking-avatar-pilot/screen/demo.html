<!doctype html>
<html><head><meta charset="utf-8"><title>demo</title>
<style>
  :root { --bg:#1e1f26; --panel:#262833; --text:#e6e6e6; --dim:#7c8193; --kw:#c792ea; --str:#c3e88d; --fn:#82aaff; --num:#f78c6c; --ok:#7ee787; }
  html,body { margin:0; height:100%; background:#14151a; font:22px/1.55 "JetBrains Mono","Fira Code",ui-monospace,monospace; color:var(--text); }
  .win { position:absolute; inset:28px; display:grid; grid-template-rows:44px 1fr 300px; border-radius:12px; overflow:hidden; background:var(--bg); box-shadow:0 10px 40px #0008; }
  .bar { background:#2d2f3b; display:flex; align-items:center; gap:10px; padding:0 18px; color:var(--dim); font-size:17px; }
  .dot { width:13px; height:13px; border-radius:50%; } .r{background:#ff5f57}.y{background:#febc2e}.g{background:#28c840}
  .tab { margin-left:18px; padding:6px 14px; background:var(--bg); border-radius:8px 8px 0 0; color:var(--text); }
  .editor { padding:22px 28px; white-space:pre; position:relative; }
  .ln { color:#4b5063; display:inline-block; width:2.2em; user-select:none; }
  .term { background:#0f1015; border-top:1px solid #333; padding:16px 26px; white-space:pre; overflow:hidden; }
  .term .p { color:var(--ok); } .dimt { color:var(--dim); }
  .caret { display:inline-block; width:11px; height:24px; background:#e6e6e6; vertical-align:-4px; animation:b 1s steps(1) infinite; }
  @keyframes b { 50% { opacity:0 } }
  .kw{color:var(--kw)} .str{color:var(--str)} .fn{color:var(--fn)} .num{color:var(--num)} .cm{color:var(--dim)}
  .hl { background:#ffd16633; border-radius:4px; transition:background .4s; }
</style></head>
<body>
<div class="win">
  <div class="bar"><span class="dot r"></span><span class="dot y"></span><span class="dot g"></span><span class="tab">fact.py</span></div>
  <div class="editor" id="ed"></div>
  <div class="term" id="term"></div>
</div>
<script>
// Timeline in seconds, driven by ?t=JSON (falls back to defaults). Each step types or prints.
const CODE = [
  ['<span class="kw">import</span> httpx', 'import'],
  ['', null],
  ['r = httpx.<span class="fn">get</span>(<span class="str">"https://uselessfacts.jsph.pl/api/v2/facts/random"</span>,', 'get'],
  ['              timeout=<span class="num">10</span>)', 'timeout'],
  ['<span class="fn">print</span>(r.status_code)', 'status'],
  ['<span class="fn">print</span>(r.<span class="fn">json</span>()[<span class="str">"text"</span>])', 'json'],
];
const q = new URLSearchParams(location.search);
const T = Object.assign({ install: 6, import: 13, get: 17, timeout: 27, status: 31, json: 36, run: 44, tip: 52 },
                        q.get('t') ? JSON.parse(q.get('t')) : {});
const ed = document.getElementById('ed'), term = document.getElementById('term');
const lines = [];
function renderEd(caretAt) {
  ed.innerHTML = lines.map((l, i) => `<span class="ln">${i + 1}</span>${l}${i === caretAt ? '<span class="caret"></span>' : ''}`).join('\n');
}
function typeHTML(idx, html, dur) {
  // reveal visible characters progressively while keeping tags intact
  const tokens = html.split(/(<[^>]+>)/).filter(Boolean);
  const total = tokens.filter(t => !t.startsWith('<')).join('').length || 1;
  const t0 = performance.now();
  return new Promise(res => {
    (function step() {
      const n = Math.min(total, Math.floor((performance.now() - t0) / (dur * 1000) * total));
      let left = n, out = '';
      for (const t of tokens) { if (t.startsWith('<')) out += t; else { out += t.slice(0, left); left = Math.max(0, left - t.length); } }
      lines[idx] = out; renderEd(idx);
      if (n < total) requestAnimationFrame(step); else res();
    })();
  });
}
let termText = '<span class="p">~/demo $</span> <span class="caret"></span>';
term.innerHTML = termText;
renderEd(-1);
const at = (s, fn) => setTimeout(fn, s * 1000);
at(T.install, () => {
  term.innerHTML = '<span class="p">~/demo $</span> pip install httpx';
  at(1.6, () => term.innerHTML += '\n<span class="dimt">Collecting httpx\n  Downloading httpx-0.28.1-py3-none-any.whl (73 kB)\nSuccessfully installed httpx-0.28.1</span>\n<span class="p">~/demo $</span> <span class="caret"></span>');
});
let li = 0;
for (const [html, key] of CODE) {
  const i = li++;
  if (!key) { at(T.import + 0.6, () => { lines[i] = ''; renderEd(i); }); continue; }
  at(T[key], () => typeHTML(i, html, Math.min(3.2, 0.9 + html.replace(/<[^>]+>/g, '').length / 30)));
}
at(T.run, () => {
  term.innerHTML = '<span class="p">~/demo $</span> python fact.py';
  at(1.2, () => term.innerHTML += '\n200\nA group of flamingos is called a "flamboyance".\n<span class="p">~/demo $</span> <span class="caret"></span>');
});
at(T.tip, () => { const t = [...ed.querySelectorAll('.num')].pop(); if (t) t.classList.add('hl'); });
</script>
</body></html>
