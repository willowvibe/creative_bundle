title: "Python 3.15 Is Out: 6 Features You'll Actually Use"
description: |
  Python 3.15 is out (3.15.2, October 2026) and it's more than speed tweaks. I tested six new features on the real release, so every output you see is from an actual run: lazy imports (startup went from 355 ms to 87 ms), frozendict, sentinel, unpacking in comprehensions, UTF-8 by default, and the new Tachyon sampling profiler.

  ⏱️ Chapters
  0:00 Intro
  0:04 Python 3.15 is out
  0:27 Install Python 3.15 with uv
  0:49 1. Lazy imports (4× faster startup)
  1:33 2. frozendict
  2:10 3. sentinel
  2:44 4. Unpacking in comprehensions
  3:12 5. UTF-8 by default
  3:45 6. Tachyon sampling profiler
  4:40 Recap

  💻 Try it yourself
  uv python install 3.15
  python3.15 -m profiling.sampling run your_script.py
  python3.15 -m profiling.sampling run --flamegraph -o flame.html your_script.py

  📚 Official sources
  What's new in Python 3.15: https://docs.python.org/3.15/whatsnew/3.15.html
  Download Python: https://www.python.org/downloads/
  PEP 810 (lazy imports): https://peps.python.org/pep-0810/
  PEP 814 (frozendict): https://peps.python.org/pep-0814/
  PEP 661 (sentinel): https://peps.python.org/pep-0661/
  PEP 798 (unpacking in comprehensions): https://peps.python.org/pep-0798/
  PEP 686 (UTF-8 by default): https://peps.python.org/pep-0686/
  PEP 799 (profiling package / Tachyon): https://peps.python.org/pep-0799/
  uv: https://docs.astral.sh/uv/

  Timings are medians of 30 runs (lazy imports) or single runs on one Linux machine; your numbers will differ a little.

  Which feature will you use first? Tell me in the comments. Next video: uv from scratch, the fastest way to set up Python in 2026. Subscribe so you don't miss it.

  The narration uses an AI voice and the presenter is an animated avatar; the code, outputs and screen recordings are real.

