title: "Stop Using pip: uv in 5 Minutes (2026 Setup)"
description: |
  uv replaces pip, venv, pyenv and pipx with one fast tool. I set it up from scratch the 2026 way, and every output on screen is from a real run (uv 0.13.9, Python 3.15.2): installing the same six packages took pip about 19 seconds, uv about 5, and uv with a warm cache 0.05 seconds. If you learned uv from an older tutorial: since uv 0.12, uv init creates a src/ package with a build system, not a single main.py.

  ⏱️ Chapters
  0:00 Intro
  0:04 The race: pip vs uv
  0:38 1. Install uv
  1:01 2. Install any Python version
  1:35 3. uv init (what changed)
  2:01 4. uv add + uv.lock
  2:36 5. uv run and uv sync
  3:02 6. Single-file scripts (PEP 723)
  3:35 7. Tools: uv tool install and uvx
  3:56 8. Move an old requirements.txt project
  4:20 9. VS Code + recap

  💻 Commands from the video
  curl -LsSf https://astral.sh/uv/install.sh | sh        (macOS / Linux)
  powershell -ExecutionPolicy ByPass -c "irm https://astral.sh/uv/install.ps1 | iex"   (Windows)
  uv python install 3.13
  uv init weather
  uv add requests rich
  uv run weather
  uv sync
  uv add --script hello_rich.py rich
  uv tool install ruff
  uvx ruff check messy.py
  uv add -r requirements.txt
  uv pip install -r requirements.txt

  📚 Official sources
  uv docs: https://docs.astral.sh/uv/
  Installing uv: https://docs.astral.sh/uv/getting-started/installation/
  Creating projects (uv init): https://docs.astral.sh/uv/concepts/projects/init/
  PEP 723 (inline script metadata): https://peps.python.org/pep-0723/

  Timings are real runs on one Linux machine (pip 24.0 on Python 3.12, empty caches); your numbers will differ.

  Previous video: Python 3.15 Is Out: 6 Features You'll Actually Use. Next video: build your first MCP server in Python with uv. Subscribe so you don't miss it.

